[project]
name = "finally-backend"
version = "0.1.0"
description = "FinAlly backend - FastAPI trading workstation server"
requires-python = ">=3.12"
dependencies = [
    "massive",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["market_data"]
